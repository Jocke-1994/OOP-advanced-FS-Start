name: Frontend CI

on:
  pull_request:
    branches: [main, "exercise/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main, "exercise/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Format, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # npm ci installerar exakt det som står i package-lock.json och failar om
      # den inte stämmer med package.json. npm install kan uppdatera låsfilen
      # och ge CI andra versioner än dem du testade lokalt.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Rätta lokalt med: npm run format
      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
